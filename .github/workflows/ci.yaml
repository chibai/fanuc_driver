name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: git config --global --add safe.directory '*'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev
      - run: cmake -B build -S . -DBUILD_TESTING=ON -DBUILD_EXAMPLES=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --install build --prefix "$RUNNER_TEMP/fanuc_driver"
      - run: cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/fanuc_driver"
      - run: cmake --build build/consumer -j2
